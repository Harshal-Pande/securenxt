[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "packages/bluetooth",
    "packages/sync",
    "packages/security",
    "packages/git-engine",
    "packages/crypto",
    "packages/storage",
    "packages/protocol",
    "shared",
]

[workspace.dependencies]
# Serialization & Encoding
prost = "0.12"
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cbor4ii = "0.3"

# Cryptography
ring = "0.17"
aes-gcm = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = "2.0"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
argon2 = "0.5"

# Database & Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Git Integration
git2 = { version = "0.18", default-features = false, features = ["vendored-libgit2"] }

# Bluetooth Stack
btleplug = "0.11"

# Concurrency & Async
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Cross-platform FFI
uniffi = "0.25"
